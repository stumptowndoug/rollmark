name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm --prefix playground ci
      - run: npm --prefix playground run build

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Verify the published artifact is importable exactly as consumers get it.
      - run: |
          npm pack
          mkdir /tmp/smoke && cd /tmp/smoke && npm init -y
          npm install "$GITHUB_WORKSPACE"/rollmark-*.tgz
          node --input-type=module -e "
            import { renderRollmark, renderChartSVG } from 'rollmark';
            const { blocks } = renderRollmark('\`\`\`chart\nbar\nsummary: s\n\nk | v\na | 1\n\`\`\`\n');
            const svg = renderChartSVG(blocks[0].spec);
            if (!svg.includes('</svg>')) throw new Error('render failed');
            console.log('pack smoke OK');
          "
